name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-core.txt
      - name: Install core dependencies
        run: python3 -m pip install -r requirements-core.txt
      - name: Check fictional fixtures
        run: python3 check_fixtures.py
      - name: Test workflow and persistence without model calls
        run: python3 test_final_workflow.py
